# Runs when a version tag appears: pushed (git tag v1.0.0 && git push origin v1.0.0) or created by
# publishing a release on GitHub. Checks everything, then publishes the release if it doesn't exist yet.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release published on the website already exists; don't try to create it twice.
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
